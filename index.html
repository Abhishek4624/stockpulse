<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StockPulse | Indian stock market, live technicals and buy signals</title>
<meta name="description" content="Search any NSE stock and see live price, technicals, fundamentals, a buy zone and the Market Mood Index.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="top">
  <div class="bar wrap">
    <a class="brand" href="#/" aria-label="StockPulse home">
      <svg viewBox="0 0 36 24" width="34" height="23" aria-hidden="true"><path d="M1 13h7l4-10 6 19 5-14 3 5h9" fill="none" stroke="#ff9d1f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>StockPulse</span>
    </a>
    <div class="search">
      <input id="q" type="search" placeholder="Search any NSE stock: Reliance, TCS, HDFC Bank…" autocomplete="off" spellcheck="false" aria-label="Search stocks" role="combobox" aria-expanded="false" aria-controls="sug">
      <ul id="sug" role="listbox" hidden></ul>
    </div>
    <div id="auth"></div>
  </div>
  <div class="tape wrap" id="tape" aria-label="Market indices"></div>
</header>

<main id="app"></main>

<footer class="foot wrap">
  <p>Prices come from Yahoo Finance for NSE tickers and can be delayed by up to 15 minutes. Signals are generated by rules on past prices. They are for learning, not investment advice. Please talk to a SEBI-registered adviser before you invest.</p>
</footer>

<dialog id="authDlg" aria-labelledby="authTitle">
  <form method="dialog" class="dlg-close"><button aria-label="Close">×</button></form>
  <div class="tabs" role="tablist">
    <button role="tab" id="tabLogin" aria-selected="true">Log in</button>
    <button role="tab" id="tabReg" aria-selected="false">Create account</button>
  </div>
  <h2 id="authTitle">Welcome back</h2>
  <div class="fields" id="authFields"></div>
  <p class="err" id="authErr" role="alert"></p>
  <button class="btn primary wide" id="authGo">Log in</button>
</dialog>

<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
